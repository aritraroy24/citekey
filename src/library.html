<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CiteKey — Library</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="library.css" />
  </head>
  <body class="page">
    <header class="page-head">
      <div class="brand">
        <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9.5 4.2c-2.6 0-3.4 1.4-3.4 3.3v2.1c0 1.2-.6 1.9-1.8 2.4 1.2.5 1.8 1.2 1.8 2.4v2.1c0 1.9.8 3.3 3.4 3.3" />
          <path d="M14.5 4.2c2.6 0 3.4 1.4 3.4 3.3v2.1c0 1.2.6 1.9 1.8 2.4-1.2.5-1.8 1.2-1.8 2.4v2.1c0 1.9-.8 3.3-3.4 3.3" />
        </svg>
        <div>
          <h1>CiteKey</h1>
          <p class="lede">Your saved entries and preferences. Everything here stays in this browser.</p>
        </div>
      </div>

      <div class="seg" role="group" aria-label="Theme">
        <button type="button" data-theme-choice="light" aria-pressed="false" title="Light">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2" /><path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6" /></svg>
          <span class="visually-hidden">Light theme</span>
        </button>
        <button type="button" data-theme-choice="dark" aria-pressed="false" title="Dark">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13.4A8.2 8.2 0 1 1 10.6 4a6.6 6.6 0 0 0 9.4 9.4z" /></svg>
          <span class="visually-hidden">Dark theme</span>
        </button>
        <button type="button" data-theme-choice="system" aria-pressed="true" title="Match system">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="1.8" /><path d="M9 20h6M12 16.5V20" /></svg>
          <span class="visually-hidden">System theme</span>
        </button>
      </div>
    </header>

    <section class="card prefs">
      <h2>Preferences</h2>
      <div class="prefs-grid">
        <div>
          <label class="label" for="defaultType">Default entry type</label>
          <select id="defaultType">
            <option value="auto">Follow the page (recommended)</option>
            <option value="article">Always @article</option>
            <option value="online">Always @online</option>
            <option value="misc">Always @misc</option>
          </select>
        </div>
        <div>
          <label class="label" for="defaultStyle">Default layout</label>
          <select id="defaultStyle">
            <option value="auto">Follow the entry type (recommended)</option>
            <option value="scholar">Always Scholar (compact)</option>
            <option value="spaced">Always spaced</option>
          </select>
        </div>
      </div>
      <label class="switch keep"><input type="checkbox" id="keepLibrary" /><span>Keep a copy of each entry I copy or save</span></label>
      <p class="hint">
        Turning this off also turns off duplicate warnings, which need the record of past keys.
        Keyboard shortcut: set one at <span class="mono">chrome://extensions/shortcuts</span> (Alt+B by default).
      </p>
    </section>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.3" /><path d="m15.8 15.8 4 4" /></svg>
        <input id="search" type="search" placeholder="Filter by key, title or URL" aria-label="Filter entries" />
      </div>
      <button id="exportAll" class="btn" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0 4-4m-4 4-4-4M4.5 19h15" /></svg>
        Export all as .bib
      </button>
      <button id="clear" class="btn btn-danger" type="button">Clear library</button>
      <span id="toast" class="toast" role="status" aria-live="polite" hidden></span>
    </div>

    <p id="count" class="count" role="status" aria-live="polite"></p>
    <ul id="entries" class="entries"></ul>

    <template id="entryTemplate">
      <li class="entry card">
        <div class="entry-head">
          <code class="entry-key chip"></code>
          <span class="entry-type"></span>
          <time class="entry-date"></time>
          <div class="entry-actions">
            <button class="entry-copy btn btn-ghost" type="button">Copy</button>
            <button class="entry-delete btn btn-ghost btn-danger" type="button">Delete</button>
          </div>
        </div>
        <p class="entry-title"></p>
        <a class="entry-url" target="_blank" rel="noreferrer noopener"></a>
        <pre class="entry-bib"></pre>
      </li>
    </template>

    <script type="module" src="library.js"></script>
  </body>
</html>
