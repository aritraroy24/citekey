<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CiteKey</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <div class="row">
        <label for="type">Entry type</label>
        <select id="type">
          <option value="article">@article</option>
          <option value="online">@online</option>
          <option value="inproceedings">@inproceedings</option>
          <option value="incollection">@incollection</option>
          <option value="book">@book</option>
          <option value="techreport">@techreport</option>
          <option value="phdthesis">@phdthesis</option>
          <option value="misc">@misc</option>
        </select>
        <label for="style">Layout</label>
        <select id="style">
          <option value="scholar">Scholar (compact)</option>
          <option value="spaced">Spaced</option>
        </select>
      </div>
      <div class="row toggles">
        <label><input type="checkbox" id="includeUrl" /> url + urldate</label>
        <label><input type="checkbox" id="includeDoi" /> doi</label>
        <button id="toggleFields" class="link" type="button" aria-expanded="false" aria-controls="fields">Edit fields</button>
      </div>
    </header>

    <p id="status" class="status" role="status" aria-live="polite">Reading the page…</p>
    <p id="dupe" class="dupe" role="alert" aria-live="assertive" hidden></p>

    <div class="row enrich" id="crossrefRow" hidden>
      <button id="crossref" class="link" type="button">Complete this entry from Crossref</button>
    </div>

    <section id="fields" hidden>
      <div class="field"><label for="f-key">Citation key</label><input id="f-key" /></div>
      <div class="field">
        <label for="f-authors">Authors <span class="hint">one per line, “Last, First”; wrap an organisation in {braces}</span></label>
        <textarea id="f-authors" rows="3"></textarea>
      </div>
      <div class="field"><label for="f-title">Title</label><textarea id="f-title" rows="2"></textarea></div>
      <div class="field"><label for="f-journal">Journal / booktitle</label><input id="f-journal" /></div>
      <div class="grid">
        <div class="field"><label for="f-year">Year</label><input id="f-year" /></div>
        <div class="field"><label for="f-volume">Volume</label><input id="f-volume" /></div>
        <div class="field"><label for="f-issue">Issue</label><input id="f-issue" /></div>
        <div class="field"><label for="f-pages">Pages</label><input id="f-pages" /></div>
      </div>
      <div class="field"><label for="f-publisher">Publisher</label><input id="f-publisher" /></div>
      <div class="field"><label for="f-doi">DOI</label><input id="f-doi" /></div>
      <div class="field"><label for="f-url">URL</label><input id="f-url" /></div>
      <div class="field"><label for="f-urldate">Accessed (urldate)</label><input id="f-urldate" /></div>
      <button id="reset" class="link" type="button">Re-read the page</button>
    </section>

    <label class="visually-hidden" for="output">BibTeX entry</label>
    <textarea id="output" spellcheck="false" rows="12"></textarea>

    <footer>
      <button id="copy" class="primary" type="button">Copy BibTeX</button>
      <button id="download" type="button">Save .bib</button>
      <button id="library" class="link" type="button">Library</button>
      <span id="toast" class="toast" role="status" aria-live="polite" hidden></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
