name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Proves the upload zip still builds and contains only what ships.
      - run: npm run package
      - uses: actions/upload-artifact@v5
        with:
          name: extension-zip
          path: dist/*.zip
